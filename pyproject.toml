[project]
name = "portfolio-data-science"
version = "0.1.0"
description = "Data science project scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2",
    "lightgbm>=4.6",
    "matplotlib>=3.10.9",
    "numpy>=2.2",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "scipy>=1.15",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
